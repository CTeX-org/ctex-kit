name: Run isolated agent
description: Run a pinned Codex or Claude Code CLI against a local checkout

inputs:
  provider:
    description: codex or claude
    required: true
  model:
    description: Model name
    required: true
  api_key:
    description: Provider API key
    required: true
  base_url:
    description: Provider base URL
    required: false
    default: ""
  workspace:
    description: Absolute consumer repository path
    required: true
  prompt_file:
    description: Absolute prompt file path
    required: true
  schema_file:
    description: Absolute JSON schema file path
    required: true
  result_file:
    description: Absolute normalized result file path
    required: true
  ignore_repository_rules:
    description: Run from a clean instruction root and ignore repository execpolicy for untrusted review checkouts
    required: false
    default: 'false'
  trusted_review_skill_file:
    description: Base-pinned PR review skill copied outside the Agent-writable checkout
    required: false
    default: ""
  trusted_comment_skill_file:
    description: Base-pinned GitHub comment skill copied outside the Agent-writable checkout
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install pinned agent CLI without model credentials
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
      run: |
        set -euo pipefail
        case "$PROVIDER" in
          codex)
            install_dir="/tmp/ctex-agent-cli/codex-0.145.0"
            npm install --ignore-scripts --no-audit --no-fund \
              --prefix "$install_dir" @openai/codex@0.145.0
            codex_path="$install_dir/node_modules/.bin/codex"
            "$codex_path" --version
            ;;
          claude)
            install_dir="/tmp/ctex-agent-cli/claude-code-2.1.148"
            npm install --ignore-scripts --no-audit --no-fund \
              --prefix "$install_dir" @anthropic-ai/claude-code@2.1.148
            wrapper="$install_dir/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs"
            test -f "$wrapper"
            node "$wrapper" --version
            ;;
          *)
            echo "::error::Unsupported provider: $PROVIDER"
            exit 1
            ;;
        esac
        chmod -R a+rX /tmp/ctex-agent-cli

    - name: Run pinned agent CLI behind root credential proxy
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        MODEL_API_KEY: ${{ inputs.api_key }}
        MODEL_BASE_URL: ${{ inputs.base_url }}
        CONSUMER_WORKSPACE: ${{ inputs.workspace }}
        PROMPT_FILE: ${{ inputs.prompt_file }}
        SCHEMA_FILE: ${{ inputs.schema_file }}
        RESULT_FILE: ${{ inputs.result_file }}
        IGNORE_REPOSITORY_RULES: ${{ inputs.ignore_repository_rules }}
        TRUSTED_REVIEW_SKILL_FILE: ${{ inputs.trusted_review_skill_file }}
        TRUSTED_COMMENT_SKILL_FILE: ${{ inputs.trusted_comment_skill_file }}
      run: |
        set -euo pipefail
        trusted_runtime=$(mktemp -d "$RUNNER_TEMP/ctex-agent-trusted-runtime.XXXXXX")
        cleanup_runtime() {
          rm -rf -- "$trusted_runtime"
        }
        trap cleanup_runtime EXIT
        chmod 711 "$trusted_runtime"
        install -m 700 \
          "$GITHUB_ACTION_PATH/../../scripts/agentic/run-agent-with-proxy.sh" \
          "$trusted_runtime/run-agent-with-proxy.sh"
        install -m 600 \
          "$GITHUB_ACTION_PATH/../../scripts/agentic/model-api-proxy.py" \
          "$trusted_runtime/model-api-proxy.py"
        install -m 600 \
          "$GITHUB_ACTION_PATH/../../scripts/agentic/agent-control-hardening.c" \
          "$trusted_runtime/agent-control-hardening.c"
        command -v cc
        cc -shared -fPIC -O2 -Wall -Wextra -Werror \
          "$trusted_runtime/agent-control-hardening.c" \
          -o "$trusted_runtime/agent-control-hardening.so"
        chmod 755 "$trusted_runtime/agent-control-hardening.so"
        trusted_instruction_dir=
        if [[ -n "$TRUSTED_REVIEW_SKILL_FILE" || -n "$TRUSTED_COMMENT_SKILL_FILE" ]]; then
          test -n "$TRUSTED_REVIEW_SKILL_FILE"
          test -n "$TRUSTED_COMMENT_SKILL_FILE"
          test -f "$TRUSTED_REVIEW_SKILL_FILE" && test ! -L "$TRUSTED_REVIEW_SKILL_FILE"
          test -f "$TRUSTED_COMMENT_SKILL_FILE" && test ! -L "$TRUSTED_COMMENT_SKILL_FILE"
          trusted_instruction_dir="$trusted_runtime/review-instructions"
          install -d -m 755 "$trusted_instruction_dir"
          install -m 444 "$TRUSTED_REVIEW_SKILL_FILE" \
            "$trusted_instruction_dir/pr-review.md"
          install -m 444 "$TRUSTED_COMMENT_SKILL_FILE" \
            "$trusted_instruction_dir/github-comment.md"
        fi
        MODEL_PROXY_SCRIPT="$trusted_runtime/model-api-proxy.py" \
          CONTROL_HARDENING_LIBRARY="$trusted_runtime/agent-control-hardening.so" \
          TRUSTED_INSTRUCTION_DIR="$trusted_instruction_dir" \
          bash "$trusted_runtime/run-agent-with-proxy.sh"

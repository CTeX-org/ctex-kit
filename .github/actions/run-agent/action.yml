name: Run agent CLI
description: Run a pinned Codex or Claude Code CLI against a local checkout

# Agent 在一次性 runner 中拥有完整本地执行权限：审查排版 PR 需要它自己跑
# l3build、编译 MWE 和比对 PDF。GitHub 影响面由调用 job 的只读 token 约束，
# Agent 步骤本身不接收 GitHub 凭据，外部写入集中在不运行 Agent 的 publisher job。

inputs:
  provider:
    description: codex or claude
    required: true
  model:
    description: Model name
    required: true
  api_key:
    description: Provider API key
    required: true
  base_url:
    description: Provider base URL
    required: false
    default: ""
  workspace:
    description: Absolute consumer repository path
    required: true
  prompt_file:
    description: Absolute prompt file path
    required: true
  schema_file:
    description: Absolute JSON schema file path
    required: true
  result_file:
    description: Absolute normalized result file path
    required: true

runs:
  using: composite
  steps:
    - name: Install pinned agent CLI
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
      run: |
        set -euo pipefail
        case "$PROVIDER" in
          codex)
            install_dir="$RUNNER_TEMP/codex-0.159.3"
            npm install --ignore-scripts --no-audit --no-fund \
              --prefix "$install_dir" @openai/codex@0.159.3
            codex_path="$install_dir/node_modules/.bin/codex"
            "$codex_path" --version
            ;;
          claude)
            install_dir="$RUNNER_TEMP/claude-code-2.1.282"
            npm install --ignore-scripts --no-audit --no-fund \
              --prefix "$install_dir" @anthropic-ai/claude-code@2.1.282
            wrapper="$install_dir/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs"
            test -f "$wrapper"
            node "$wrapper" --version
            ;;
          *)
            echo "::error::Unsupported provider: $PROVIDER"
            exit 1
            ;;
        esac

    - name: Run pinned agent CLI
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        API_KEY: ${{ inputs.api_key }}
        BASE_URL: ${{ inputs.base_url }}
        CONSUMER_WORKSPACE: ${{ inputs.workspace }}
        PROMPT_FILE: ${{ inputs.prompt_file }}
        SCHEMA_FILE: ${{ inputs.schema_file }}
        RESULT_FILE: ${{ inputs.result_file }}
      run: |
        set -euo pipefail
        test -n "$API_KEY"
        test -d "$CONSUMER_WORKSPACE"
        test -s "$PROMPT_FILE"
        test -s "$SCHEMA_FILE"
        mkdir -p "$(dirname "$RESULT_FILE")"

        case "$PROVIDER" in
          codex)
            codex_path="$RUNNER_TEMP/codex-0.159.3/node_modules/.bin/codex"
            test -x "$codex_path"
            export OPENAI_API_KEY="$API_KEY"
            export CODEX_HOME="$RUNNER_TEMP/codex-home"
            mkdir -p "$CODEX_HOME"
            endpoint="${BASE_URL:-https://api.openai.com}"
            endpoint="${endpoint%/}"
            case "$endpoint" in
              */v1) ;;
              *) endpoint="$endpoint/v1" ;;
            esac
            cat > "$CODEX_HOME/config.toml" <<EOF
        model = "$MODEL"
        model_provider = "gateway"
        service_tier = "priority"
        model_reasoning_effort = "high"

        [model_providers.gateway]
        name = "gateway"
        base_url = "$endpoint"
        env_key = "OPENAI_API_KEY"
        wire_api = "responses"
        EOF

            # 托管 runner 上 Codex 自带的 bubblewrap 会因无法配置 loopback 网络而在
            # 沙箱初始化阶段失败，因此直接跳过审批与沙箱。
            "$codex_path" exec \
              --cd "$CONSUMER_WORKSPACE" \
              --skip-git-repo-check \
              --ephemeral \
              --dangerously-bypass-approvals-and-sandbox \
              --output-schema "$SCHEMA_FILE" \
              --output-last-message "$RESULT_FILE" \
              - < "$PROMPT_FILE"
            ;;
          claude)
            wrapper="$RUNNER_TEMP/claude-code-2.1.282/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs"
            test -f "$wrapper"

            export ANTHROPIC_API_KEY="$API_KEY"
            export ANTHROPIC_AUTH_TOKEN="$API_KEY"
            ANTHROPIC_BASE_URL="${BASE_URL:-https://llm.fantacy.live}"
            export ANTHROPIC_BASE_URL="${ANTHROPIC_BASE_URL%/}"
            export ANTHROPIC_CUSTOM_HEADERS="Authorization: Bearer $API_KEY"
            export DISABLE_AUTOUPDATER=1
            schema="$(jq -c . "$SCHEMA_FILE")"
            raw_result="$RUNNER_TEMP/claude-result.json"
            set +e
            # --bare 禁用 CLAUDE.md 自动发现：被审查的 checkout 是不可信输入，
            # 其中的项目指令不应作为 Agent 指令生效。
            (
              cd "$CONSUMER_WORKSPACE"
              node "$wrapper" -p \
                --bare \
                --no-session-persistence \
                --model "$MODEL" \
                --dangerously-skip-permissions \
                --output-format json \
                --json-schema "$schema" \
                < "$PROMPT_FILE" > "$raw_result"
            )
            claude_rc=$?
            set -e

            # 失败时 CLI 的错误原因只在 stdout JSON 的 result 字段里，stderr 为空。把诊断字段
            # 压成一行 ::error:: 注释：result 可能含 Issue/PR 派生文本，转义 %/CR/LF 后无法另起
            # 一行伪造 workflow 命令；secret 仍由 Actions 日志遮蔽。
            if [[ "$claude_rc" -ne 0 ]] || ! jq -e '(.is_error? // false) == false' "$raw_result" > /dev/null 2>&1; then
              if [[ ! -s "$raw_result" ]]; then
                detail="CLI 未输出结果"
              elif ! detail=$(jq -r '"is_error=\(.is_error // "null") api_error_status=\(.api_error_status // "null") subtype=\(.subtype // "null") result=\((.result // "") | tostring | .[0:2000])"' "$raw_result" 2> /dev/null); then
                detail="CLI 输出不是 JSON：$(head -c 2000 "$raw_result")"
              fi
              detail=${detail//'%'/'%25'}
              detail=${detail//$'\r'/'%0D'}
              detail=${detail//$'\n'/'%0A'}
              echo "::error::Claude Code 调用失败（退出码 ${claude_rc}）：${detail}"
              exit 1
            fi
            jq -c '
              if (.structured_output? | type) == "object" then .structured_output
              elif type == "object" then .
              else error("Claude did not return a structured object")
              end
            ' "$raw_result" > "$RESULT_FILE"
            ;;
          *)
            echo "::error::Unsupported provider: $PROVIDER"
            exit 1
            ;;
        esac

        test -s "$RESULT_FILE"
        jq -e 'type == "object"' "$RESULT_FILE" > /dev/null

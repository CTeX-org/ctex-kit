name: ctex-kit test

on:
  pull_request:
    types:
      # added "ready_for_review"
      # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request
      [opened, ready_for_review, reopened, synchronize]
    paths-ignore:
      - 'llmdoc/**'
      - '**/README.md'
      - '**/README-en.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.gitignore'
      - '.gitattributes'
      - '.claude/**'
      - '.githooks/**'
      # 只 ignore agentic 系列 workflow — 这些改动不影响主测.
      # test.yml / release*.yml / lint-test-files.yml 等核心 workflow
      # 改了**必须**触发 CI 验证, 不能 ignore.
      - '.github/workflows/agentic-*.yml'
  push:
    paths-ignore:
      - 'llmdoc/**'
      - '**/README.md'
      - '**/README-en.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.gitignore'
      - '.gitattributes'
      - '.claude/**'
      - '.githooks/**'
      - '.github/workflows/agentic-*.yml'
  schedule:
    # 周一 UTC 12:00 (北京时间 20:00). 故意贴 ISO 周边界 (周一 00:00 UTC
    # 翻周) 后约 12h — 角色是 weekly cache 的 **fallback 哨兵**, 不是
    # 主动刷新源.
    #
    # 实际刷新模型: 周一 00:00 UTC 翻周后, W## cache key 翻新, "W## 内
    # 第一个 run" 自然 cache miss → 走完整 setup-texlive (install +
    # update-all) → save 新 cache. 周内剩余 run 全 cache hit. 既然
    # "首个 run" 通常就是周一早上的某次 push, schedule 实际上多半
    # 撞 cache hit 旁观, 不真刷新.
    #
    # 留 schedule 的意义: 万一某周周一 00:00~12:00 UTC 完全没人 push
    # (例如假期 / 长 PR 评审周), 12 UTC schedule 接住 cache miss, 主动
    # 把 W## cache 填好, 当周首个 push/PR 不必背 install-tl ~70s 成本.
    # 也就是 "周内首次刷新的兜底", 不是主动定时刷新.
    #
    # GH cron 漂移 3h+ 不影响这个角色 — fallback 哨兵晚来无所谓, 真有
    # push 早把 cache 填好了; 真没 push, 晚一点填上也没事. 见 changes
    # job 的 tl-cache-week 输出 + warmup-tl 的 bypass cache 设计.
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  # group 加 event_name 维度: 主仓自家分支 push 与 pull_request 同 head sha
  # 双触发时, 两个 run 进不同 group 互不 cancel — 否则后触发的 pull_request
  # run 会 cancel 前面的 push run, GH UI 把 cancelled status 算 fail, PR 显红
  # (实测 PR #921 / #922 踩坑). 配合 changes job 的 head-guard if (主仓 PR 的
  # pull_request 全 skip), 副作用降到最低: pull_request run 只跑 changes 出
  # SKIPPED, 几秒内出 test-result SUCCESS, 不浪费 runner 资源.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_name != 'master' }}

env:
  # TeX Live 版本统一定义. setup-texlive-action 4 处调用都用这个值, 跳过
  # remote version check (PR #899 实测在 cache restore 前联网, mirror 抖动
  # 时即便 cache 命中也会让 install-tl 步骤 ETIMEDOUT). TL 年度发版时只需
  # 改这一处, _test-package.yml 通过 workflow_call input 透传.
  TL_VERSION: '2026'

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 阶段 0: 检测改了哪些包. push / schedule / workflow_dispatch 触发时
  # 一律跑全包 (回归保险); pull_request 触发时按 path 过滤精确跑.
  # 依赖反查: ctex 依赖 xeCJK + zhnumber, 所以 xeCJK 或 zhnumber 改了也要
  # 跑 ctex.
  #
  # if: 主仓自家分支 push 与 pull_request 都会触发 — push 已经跑过完整
  # CI, pull_request synchronize 再跑一遍是冗余, 而且两者同 concurrency
  # group, 后者会 cancel 前者, GH UI 留 cancelled status 显红 (实测 PR
  # #921 踩坑). 这里只让 pull_request 在 fork PR (head 仓库 != 主仓) 上
  # 生效: fork 的 push 不会触发主仓 workflow, 必须靠 pull_request 才能
  # 在 fork PR 上跑 CI; 主仓自家分支的 pull_request 直接 skip, 让 push
  # 路径单独负责.
  # ──────────────────────────────────────────────────────────────────────
  changes:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      # 六个 bool, 给下游各 caller job 的 if 用. push / schedule /
      # workflow_dispatch 触发时全部 true; pull_request 时按 path filter 结果.
      ctex:       ${{ steps.compute.outputs.ctex }}
      xeCJK:      ${{ steps.compute.outputs.xeCJK }}
      xpinyin:    ${{ steps.compute.outputs.xpinyin }}
      zhnumber:   ${{ steps.compute.outputs.zhnumber }}
      CJKpunct:   ${{ steps.compute.outputs.CJKpunct }}
      zhlineskip: ${{ steps.compute.outputs.zhlineskip }}
      # TL_VERSION 透传给 caller (workflow_call inputs 不能直接引用顶层 env).
      tl-version: ${{ env.TL_VERSION }}
      # ISO 年-周 (例 "2026-W26"), 用作 TL bypass cache key 的时间维度.
      # 每周一 UTC 00:00 自动翻周, W## 内首个 run cache miss 触发完整
      # setup-texlive (install + update-all) + save 新 cache, 周内剩余
      # run 全 cache hit, 跳过整个 TL install + update 流程
      # (~70-600s/job → 秒过). 周一 12 UTC 的 schedule 是 fallback 哨兵
      # (见上方 on.schedule 注释), 当周完全无 push 时由它接住 cache miss.
      tl-cache-week: ${{ steps.compute.outputs.tl-cache-week }}
    steps:
      - uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # 公共改动 → 全包都要跑
            _all: &all
              - '.github/workflows/test.yml'
              - '.github/workflows/_test-package.yml'
              - '.github/font-urls.txt'
              - 'scripts/check-parallel.sh'
              - 'support/**'
              - 'Makefile'
            ctex:
              - *all
              - 'ctex/**'
              # ctex 依赖 xeCJK + zhnumber, 它们改了也要跑 ctex
              - 'xeCJK/**'
              - 'zhnumber/**'
            xeCJK:
              - *all
              - 'xeCJK/**'
            xpinyin:
              - *all
              - 'xpinyin/**'
              # xpinyin 的 XeTeX 路线以工作树里的 xeCJK 为运行时依赖
              # (build.lua 的 checkdeps + checkinit_hook), 所以 xeCJK 改了
              # 也要跑 xpinyin.
              - 'xeCJK/**'
            zhnumber:
              - *all
              - 'zhnumber/**'
            CJKpunct:
              - *all
              - 'CJKpunct/**'
            zhlineskip:
              - *all
              - 'zhlineskip/**'
      - name: Compute active packages
        id: compute
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          FILTER_CTEX:       ${{ steps.filter.outputs.ctex       }}
          FILTER_XECJK:      ${{ steps.filter.outputs.xeCJK      }}
          FILTER_XPINYIN:    ${{ steps.filter.outputs.xpinyin    }}
          FILTER_ZHNUMBER:   ${{ steps.filter.outputs.zhnumber   }}
          FILTER_CJKPUNCT:   ${{ steps.filter.outputs.CJKpunct   }}
          FILTER_ZHLINESKIP: ${{ steps.filter.outputs.zhlineskip }}
        run: |
          # PR 走 path filter; 其它触发全跑.
          if [ "$IS_PR" != "true" ]; then
            for p in ctex xeCJK xpinyin zhnumber CJKpunct zhlineskip; do
              echo "${p}=true" >> "$GITHUB_OUTPUT"
            done
            echo "Non-PR trigger: running all packages"
          else
            echo "ctex=${FILTER_CTEX:-false}"             >> "$GITHUB_OUTPUT"
            echo "xeCJK=${FILTER_XECJK:-false}"           >> "$GITHUB_OUTPUT"
            echo "xpinyin=${FILTER_XPINYIN:-false}"       >> "$GITHUB_OUTPUT"
            echo "zhnumber=${FILTER_ZHNUMBER:-false}"     >> "$GITHUB_OUTPUT"
            echo "CJKpunct=${FILTER_CJKPUNCT:-false}"     >> "$GITHUB_OUTPUT"
            echo "zhlineskip=${FILTER_ZHLINESKIP:-false}" >> "$GITHUB_OUTPUT"
            echo "PR path filter: ctex=${FILTER_CTEX} xeCJK=${FILTER_XECJK} xpinyin=${FILTER_XPINYIN} zhnumber=${FILTER_ZHNUMBER} CJKpunct=${FILTER_CJKPUNCT} zhlineskip=${FILTER_ZHLINESKIP}"
          fi
          # ISO 8601 年-周 (例 "2026-W26"). `%G` 是 ISO 周对应的年份 (与 `%V`
          # 配套), 不是日历年 `%Y` — 跨年那周 (例 2025-12-29 周一) `%V` 报
          # 2026-W01 但 `%Y` 还是 2025, 用 `%Y-W%V` 会得到 `2025-W01` 错 key,
          # 与下一周 `2026-W02` 不连续, 害每年 1-3 天假阳 cache miss.
          # UTC 跟 GH Actions 调度时区一致.
          week="$(TZ=UTC date +'%G-W%V')"
          echo "tl-cache-week=${week}" >> "$GITHUB_OUTPUT"
          echo "TL cache week: ${week}"

  # ──────────────────────────────────────────────────────────────────────
  # 阶段 0.5: 预热 TeX Live 缓存 + 用 actions/cache 自定义 save 整个 TEXDIR
  # 到 weekly bypass key. 让 caller 完全跳过 setup-texlive-action.
  #
  # 动机: setup-texlive-action 的 cache 设计是"同 primaryKey immutable",
  # 一旦保存就不更新. 即便 warmup 跑了 update-all, 也无法把 update 后的
  # 状态回写到原 primaryKey, caller restore 时永远拿到的是 update 前的
  # baseline, 必须自己再跑 70s+ 的 tlmgr update. mirror 抖动时 update
  # 阶段单 step 卡 10min 不奇怪 (PR #899 实测 macos test-ctex 17min).
  #
  # 绕开方案: warmup-tl 跑完 setup-texlive 后, 把整个 $TEXDIR (默认
  # $RUNNER_TEMP/setup-texlive-action/2026) 用 actions/cache@v6 save 到
  # 自定义 key (含 year-week). caller 直接 restore 这份 cache + 把
  # $TEXDIR/bin/<platform> 加入 PATH, 完全不跑 setup-texlive-action, 不
  # 联网, 秒过.
  #
  # 周一翻周后, W## 内首个 run cache miss 触发完整 install + update-all
  # 并 save 新 cache; 周内 PR / push 享用 cache hit. cache miss (例
  # weekly 边界 + push race / cache eviction) 时 caller fallback 到
  # setup-texlive-action. 周一 12 UTC 的 schedule 是 fallback 哨兵 (见
  # 顶部 on.schedule 注释), 当周完全无 push 时由它兜底刷新 cache.
  #
  # warmup-tl 内部 3 mirror retry 应对 install-tl ETIMEDOUT (try 1
  # illinois 10min, try 2 fau.de 10min, try 3 mirror.ctan.org 30min 兜底).
  # ──────────────────────────────────────────────────────────────────────
  warmup-tl:
    needs: changes
    # 只要有任何 caller 要跑, 就要预热
    if: |
      needs.changes.outputs.ctex == 'true'
      || needs.changes.outputs.xeCJK == 'true'
      || needs.changes.outputs.xpinyin == 'true'
      || needs.changes.outputs.zhnumber == 'true'
      || needs.changes.outputs.CJKpunct == 'true'
      || needs.changes.outputs.zhlineskip == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tl-pkgs: ""
            shell: bash
            tl-bin-platform: x86_64-linux
            tlmgr-exe: tlmgr
          - os: macos-latest
            tl-pkgs: ""
            shell: bash
            # Apple Silicon. setup-texlive-action 装到 universal-darwin, 但
            # bin 目录是 universal-darwin (含 arm64+x86_64 universal binary).
            tl-bin-platform: universal-darwin
            tlmgr-exe: tlmgr
          - os: windows-latest
            tl-pkgs: wintools.windows
            shell: C:\msys64\usr\bin\bash.exe -e {0}
            tl-bin-platform: windows
            # Windows tlmgr 是 tlmgr.bat, msys2 bash 不补 PATHEXT, 这里 sanity
            # check 阶段直调必须用全名.
            tlmgr-exe: tlmgr.bat
    name: warmup-tl on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      # bypass cache (我们自己管的, 与 setup-texlive 内部 cache 解耦).
      # key 含 year-week, 同周内 cache hit; 跨周翻新.
      # path 用 setup-texlive 默认装的 $RUNNER_TEMP/setup-texlive-action/<version>.
      - name: TL bypass cache (warmup save)
        id: bypass-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/setup-texlive-action/${{ env.TL_VERSION }}
          # key 含 weekly + tl_packages hash:
          #   - weekly: 周一翻周后 W## 内首个 run cache miss 自然刷新,
          #     周内剩余 run 享用 cache hit (schedule 是 fallback 哨兵)
          #   - tl_packages hash: 改 tl_packages (例加新包) 立即 invalidate, 防
          #     PR 加新包时 release / 下游 caller 用到老 cache 找不到包 fail
          #     (实测 zhlineskip-v1.0f 加 inconsolata 后老 cache 没含, release.yml
          #     从 cache restore 后直接 fontspec 报 Inconsolatazi4 找不到).
          key: tl-bypass-${{ runner.os }}-${{ env.TL_VERSION }}-${{ needs.changes.outputs.tl-cache-week }}-${{ hashFiles('.github/tl_packages') }}

      # cache hit: 跳过整个 setup-texlive 流程, 只 export PATH.
      # cache miss: 跑 setup-texlive (3 mirror retry) + verification, cache 会在
      # job 末尾自动 save (actions/cache@v6 行为).
      #
      # 用 step 级 continue-on-error 而非 `|| true` — cache 真损坏时 step 标记
      # failure annotation, warmup 日志能看到, 否则 warmup 全绿但下游 caller
      # 全走 fallback 重装就很难定位.
      - name: Export PATH (cache hit fast path)
        if: steps.bypass-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        run: |
          TL_BIN="${{ runner.temp }}/setup-texlive-action/${{ env.TL_VERSION }}/bin/${{ matrix.tl-bin-platform }}"
          echo "$TL_BIN" >> "$GITHUB_PATH"
          echo "Added to PATH: $TL_BIN"
          # 用 cache 内的 tlmgr 验证一下 (不联网, 看本地 db 是否完好)
          # Windows: tlmgr 实际是 tlmgr.bat, msys2 bash 不补 PATHEXT, 显式带后缀.
          "$TL_BIN/${{ matrix.tlmgr-exe }}" version

      # 同 _test-package.yml 内的 retry 三段: 应对首次冷启动时 mirror
      # ETIMEDOUT 间歇失败. 这里是唯一会真装 install-tl 的地方 — 一旦
      # 这里成功保住 cache, 下游 5 caller × 3 OS 全部走 bypass cache hit.
      #
      # 三次 retry 换不同 mirror, 避免单一 mirror 长时间不可达时 3 次
      # 都炸 (实测 PR #899 上 ctan.math.illinois.edu 单点不通时 3 次
      # 同 mirror 全 ETIMEDOUT). try 2 走德国 fau.de, try 3 走 ctan.org
      # 全球自动重定向. try 1/2 短超时 10min 让换 mirror 反应快, try 3
      # 30min 兜底 (冷启动正常 3-5min, 留余量).
      - name: Install TeX Live (try 1, illinois mirror)
        if: steps.bypass-cache.outputs.cache-hit != 'true'
        id: tl1
        continue-on-error: true
        timeout-minutes: 10
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: ${{ env.TL_VERSION }}
          package-file: .github/tl_packages
          packages: ${{ matrix.tl-pkgs }}
          repository: https://ctan.math.illinois.edu/systems/texlive/tlnet
          # warmup 总是 update-all, 把 cache 推到 TLnet 最新.
          update-all-packages: true
          # 关掉 setup-texlive 内部的 cache, 让它每次真跑 install + update.
          # 我们自己用 actions/cache@v6 (上面的 bypass-cache) 缓存 update
          # 后的 TEXDIR. 内部 cache 的"同 primaryKey immutable"设计正是
          # 我们要绕开的.
          cache: false

      - name: Install TeX Live (try 2, fau.de mirror)
        if: steps.bypass-cache.outputs.cache-hit != 'true' && steps.tl1.outcome == 'failure'
        id: tl2
        continue-on-error: true
        timeout-minutes: 10
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: ${{ env.TL_VERSION }}
          package-file: .github/tl_packages
          packages: ${{ matrix.tl-pkgs }}
          repository: https://ftp.fau.de/ctan/systems/texlive/tlnet
          update-all-packages: true
          cache: false

      - name: Install TeX Live (try 3, ctan.org auto-redirect, final)
        if: steps.bypass-cache.outputs.cache-hit != 'true' && steps.tl1.outcome == 'failure' && steps.tl2.outcome == 'failure'
        timeout-minutes: 30
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: ${{ env.TL_VERSION }}
          package-file: .github/tl_packages
          packages: ${{ matrix.tl-pkgs }}
          repository: https://mirror.ctan.org/systems/texlive/tlnet
          update-all-packages: true
          cache: false

      # 验证 cache 真的 update 到了最新 TLnet (而非 tlmgr 在 mirror 不通时
      # silent fallback 用本地老 db). 只在 cache miss 走 setup-texlive 时
      # 跑 — cache hit 时跑这步会引入两个问题:
      #   1. 本不需要联网, 反而联 mirror, mirror 抖动时把 warmup fail 掉,
      #      下游 5 caller 全被 needs: warmup-tl 阻塞 (这正是 bypass cache
      #      最想避免的)
      #   2. cache hit 时 TL 是 warmup 上次 verify 过的, 内容稳定
      # cache hit 路径下 cache 真损坏怎么办: caller 端 export-path step 用
      # continue-on-error 自愈, 走 setup-texlive fallback.
      - name: Verify TL mirror reachable (fallback path only)
        if: steps.bypass-cache.outputs.cache-hit != 'true'
        run: |
          out=$(tlmgr update --self --list 2>&1) || true
          echo "$out"
          if echo "$out" | grep -qiE "Unable to download|not verified"; then
            echo "::error::tlmgr 报 mirror 不可达, silent fallback 用本地老 db. cache 写入的 TL revision 偏老, 下游 caller 测试一定 fail. 重跑 (rerun --failed)."
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────
  # 阶段 1: 5 个 caller job, 每个 uses _test-package.yml. 用 reusable
  # workflow 避免 matrix.pkg 维度造成的"幽灵 cancelled job" (动态 name
  # 模板在 strategy expansion 前 GH 注册 placeholder check 用未渲染模板
  # 作 name, 然后 cancel — 这是 GH Actions 已知行为).
  #
  # 5 个 caller 都 needs warmup-tl: cache 已被 warmup 填好, caller 内的
  # setup-texlive-action 100% 走 cache hit, 不再有 mirror ETIMEDOUT 风险.
  # ──────────────────────────────────────────────────────────────────────
  # ctex 主测拆 2 job 并行: 实测 (PR #902) luatex 单 engine ~8min 远慢于
  # 其他 3 engine 加起来 ~3min. 同一 caller 内开 5 进程 (3 engine + luatex
  # 切 2 桶) 会 oversubscribe 4 vCPU 反而拖慢全体. 拆 job 后:
  #   - test-ctex: pdftex/xetex/uptex 3 engine 并行 + Phase 2 configs
  #   - test-ctex-luatex: luatex 切 4 桶并行, 独占 runner 4 vCPU
  # 两 job 同时跑, wall-clock = max(两者), 都 ~3-4min, 整 run 进 6min 内.
  test-ctex:
    needs: [changes, warmup-tl]
    if: needs.changes.outputs.ctex == 'true'
    uses: ./.github/workflows/_test-package.yml
    with:
      pkg: ctex
      event-name: ${{ github.event_name }}
      tl-version: ${{ needs.changes.outputs.tl-version }}
      tl-cache-week: ${{ needs.changes.outputs.tl-cache-week }}
      engines: pdftex xetex uptex
      configs: test/config-cmap test/config-contrib test/config-ctxdoc

  test-ctex-luatex:
    needs: [changes, warmup-tl]
    if: needs.changes.outputs.ctex == 'true'
    uses: ./.github/workflows/_test-package.yml
    with:
      pkg: ctex
      event-name: ${{ github.event_name }}
      tl-version: ${{ needs.changes.outputs.tl-version }}
      tl-cache-week: ${{ needs.changes.outputs.tl-cache-week }}
      engines: luatex
      luatex-buckets: 4

  test-xeCJK:
    needs: [changes, warmup-tl]
    if: needs.changes.outputs.xeCJK == 'true'
    uses: ./.github/workflows/_test-package.yml
    with:
      pkg: xeCJK
      event-name: ${{ github.event_name }}
      tl-version: ${{ needs.changes.outputs.tl-version }}
      tl-cache-week: ${{ needs.changes.outputs.tl-cache-week }}

  test-xpinyin:
    needs: [changes, warmup-tl]
    if: needs.changes.outputs.xpinyin == 'true'
    uses: ./.github/workflows/_test-package.yml
    with:
      pkg: xpinyin
      event-name: ${{ github.event_name }}
      tl-version: ${{ needs.changes.outputs.tl-version }}
      tl-cache-week: ${{ needs.changes.outputs.tl-cache-week }}
      # 主 testfiles/ 走 xetex; CJKutf8 那条线在独立 config 里走 pdftex
      # (两者引擎需求不同, 不能共用 testfiledir, 见 xpinyin/build.lua 注释).
      configs: test/config-cjk
      # unpack 阶段要跑 `texlua xpinyin.lua` 生成拼音数据库, 需要 Unihan.zip.
      needs-unihan: true

  test-zhnumber:
    needs: [changes, warmup-tl]
    if: needs.changes.outputs.zhnumber == 'true'
    uses: ./.github/workflows/_test-package.yml
    with:
      pkg: zhnumber
      event-name: ${{ github.event_name }}
      tl-version: ${{ needs.changes.outputs.tl-version }}
      tl-cache-week: ${{ needs.changes.outputs.tl-cache-week }}

  test-CJKpunct:
    needs: [changes, warmup-tl]
    if: needs.changes.outputs.CJKpunct == 'true'
    uses: ./.github/workflows/_test-package.yml
    with:
      pkg: CJKpunct
      event-name: ${{ github.event_name }}
      tl-version: ${{ needs.changes.outputs.tl-version }}
      tl-cache-week: ${{ needs.changes.outputs.tl-cache-week }}

  test-zhlineskip:
    needs: [changes, warmup-tl]
    if: needs.changes.outputs.zhlineskip == 'true'
    uses: ./.github/workflows/_test-package.yml
    with:
      pkg: zhlineskip
      event-name: ${{ github.event_name }}
      tl-version: ${{ needs.changes.outputs.tl-version }}
      tl-cache-week: ${{ needs.changes.outputs.tl-cache-week }}

  # ──────────────────────────────────────────────────────────────────────
  # 阶段 2: 汇总 — 给分支保护规则用. 如果任何 test caller 或 warmup-tl
  # 失败, 这个 job 也 fail. 这样 branch protection 上只盯这一个 status
  # check 就够了.
  # ──────────────────────────────────────────────────────────────────────
  test-result:
    if: ${{ !cancelled() }}
    needs: [warmup-tl, test-ctex, test-ctex-luatex, test-xeCJK, test-xpinyin, test-zhnumber, test-CJKpunct, test-zhlineskip]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all caller jobs (incl. warmup-tl) succeeded or were skipped
        env:
          R_WARMUP:        ${{ needs.warmup-tl.result }}
          R_CTEX:          ${{ needs.test-ctex.result }}
          R_CTEX_LUATEX:   ${{ needs.test-ctex-luatex.result }}
          R_XECJK:         ${{ needs.test-xeCJK.result }}
          R_XPINYIN:       ${{ needs.test-xpinyin.result }}
          R_ZHNUMBER:      ${{ needs.test-zhnumber.result }}
          R_CJKPUNCT:      ${{ needs.test-CJKpunct.result }}
          R_ZHLINESKIP:    ${{ needs.test-zhlineskip.result }}
        run: |
          fail=0
          for nv in \
            "warmup-tl:$R_WARMUP" \
            "ctex:$R_CTEX" \
            "ctex-luatex:$R_CTEX_LUATEX" \
            "xeCJK:$R_XECJK" \
            "xpinyin:$R_XPINYIN" \
            "zhnumber:$R_ZHNUMBER" \
            "CJKpunct:$R_CJKPUNCT" \
            "zhlineskip:$R_ZHLINESKIP"; do
            name="${nv%%:*}"
            res="${nv#*:}"
            if [ "$res" = "success" ] || [ "$res" = "skipped" ]; then
              echo "✓ ${name}: ${res}"
            else
              echo "✗ ${name}: ${res}"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

  # 定时任务(weekly cache fallback 哨兵)失败时自动开 issue。
  #
  # 角色与 PR/push 的红叉不同: 定时那次 cache miss 会走完整 setup-texlive
  # (install + update-all), 因而**引入上游更新**——上游一旦 break 我们的
  # 回归, 定时任务是第一个撞上的地方(见 #1080 tocloft/fontspec、#1048/#1050
  # l3backend/pgf)。PR/push 的失败有红叉和 PR 评论, 不需要 issue; 只有无人
  # 盯着的定时失败才值得开 issue 提醒。
  #
  # 三重守卫: 只在 schedule 事件、只在主仓、只在 test-result 失败时触发。
  # fork 默认不排 schedule; github.repository 守卫是双保险(#874/#875 同款)。
  # issue 一旦 opened, agentic-issue-dispatch.yml 会自动接手初步分析。
  file-issue-on-schedule-failure:
    if: >-
      always()
      && github.event_name == 'schedule'
      && github.repository == 'CTeX-org/ctex-kit'
      && needs.test-result.result == 'failure'
    needs: [test-result, test-ctex, test-ctex-luatex, test-xeCJK, test-xpinyin, test-zhnumber, test-CJKpunct, test-zhlineskip]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: File or update the nightly-failure issue
        env:
          GH_TOKEN:        ${{ github.token }}
          REPO:            ${{ github.repository }}
          RUN_ID:          ${{ github.run_id }}
          SERVER:          ${{ github.server_url }}
          R_CTEX:          ${{ needs.test-ctex.result }}
          R_CTEX_LUATEX:   ${{ needs.test-ctex-luatex.result }}
          R_XECJK:         ${{ needs.test-xeCJK.result }}
          R_XPINYIN:       ${{ needs.test-xpinyin.result }}
          R_ZHNUMBER:      ${{ needs.test-zhnumber.result }}
          R_CJKPUNCT:      ${{ needs.test-CJKpunct.result }}
          R_ZHLINESKIP:    ${{ needs.test-zhlineskip.result }}
        run: |
          set -euo pipefail

          RUN_URL="${SERVER}/${REPO}/actions/runs/${RUN_ID}"
          # 周粒度去重标题(不含 run id): 一次上游漂移会让多个 test job 同时红,
          # 但只有一个聚合 job 开 issue, 无 wangshu 那种 3-tier 竞态; 周粒度还能
          # 把"连续几天都红"归并到同一个 issue 上评论, 而不是每天新开。
          WEEK=$(date -u +%G-W%V)
          TITLE="nightly test failure (${WEEK}) — 疑似上游漂移"

          # 失败的 job 清单(success/skipped 之外的都算 red)。
          FAILED=""
          for nv in \
            "ctex:$R_CTEX" \
            "ctex-luatex:$R_CTEX_LUATEX" \
            "xeCJK:$R_XECJK" \
            "xpinyin:$R_XPINYIN" \
            "zhnumber:$R_ZHNUMBER" \
            "CJKpunct:$R_CJKPUNCT" \
            "zhlineskip:$R_ZHLINESKIP"; do
            name="${nv%%:*}"; res="${nv#*:}"
            case "$res" in
              success|skipped) ;;
              *) FAILED="${FAILED}- \`${name}\`: ${res}\n" ;;
            esac
          done

          # 拉本次 run 的 diff artifact(各 _test-package.yml 子 job 上传,
          # 名为 ctex-kit-diff-*), 把 .diff 正文截断后贴进 body——这是判断
          # "上游漂移 vs 本仓回归"最直接的信号(#1080 的教训: 失败集合的
          # 分布差异是成因数量的线索)。拉不到就退化为只给链接。
          DIFF_SECTION=""
          mkdir -p /tmp/nightly-diffs
          if gh run download "$RUN_ID" --repo "$REPO" \
               --pattern 'ctex-kit-diff-*' --dir /tmp/nightly-diffs 2>/dev/null; then
            DIFF_BODY="$(find /tmp/nightly-diffs -name '*.diff' -type f 2>/dev/null \
                         | sort | while read -r f; do
                             # 每个 diff 一个 fenced code block; 用 awk 截断到 120 行
                             # 内, 末尾无条件补一个换行让闭合围栏独占一行(diff 文件
                             # 末尾有无换行不定, 直接 echo '```' 可能贴到最后一行尾)。
                             printf '### %s\n\n```diff\n' "${f#/tmp/nightly-diffs/}"
                             awk 'NR<=120' "$f"
                             printf '\n```\n\n'
                           done | head -c 40000 || true)"
            if [ -n "$DIFF_BODY" ]; then
              DIFF_SECTION="$(printf '\n\n## 失败 diff(截断, 完整见 run artifact)\n\n%s' "$DIFF_BODY")"
            else
              DIFF_SECTION=$'\n\n## 失败 diff\n\n未找到 `.diff`——失败可能不是基线不匹配(如加载期/环境错误), 见 run 日志。\n'
            fi
          else
            DIFF_SECTION=$'\n\n## 失败 diff\n\n未能下载 diff artifact(可能失败发生在产出 diff 之前), 见 run 日志。\n'
          fi

          # body 分三段拼接。HEAD/TAIL 是静态文本; YAML 块标量 `run: |` 会把整个
          # 脚本的公共基准缩进(这里 10 空格)剥掉, 因此下面 heredoc 的内容行必须
          # 顶着基准缩进写(与结束标记 EOF 同级), 剥基准后正好顶格进入 body, 无需
          # 再 sed。任何相对基准多出的缩进都会原样留在 body 里(会破坏 markdown),
          # 所以续行也顶格。DIFF_SECTION 由前面单独构造、原样夹在中间——它含 diff
          # 正文里的真实缩进(如 \hbox 节点), 绝不能再做任何缩进处理。
          HEAD="$(cat <<EOF
          定时回归任务(weekly cache fallback 哨兵)失败。这一次 cache miss 会走完整
          \`setup-texlive\`(install + update-all), **引入上游更新**, 因此本次红**很可能是
          上游宏包漂移把回归跑挂**, 也可能是本仓自身问题——判据是失败集合的分布(见下)。

          - **run**: ${RUN_URL}
          - **失败的包**:

          $(printf '%b' "${FAILED:-（未能从 job 结果判定, 见 run 日志）}")
          EOF
          )"
          TAIL="$(cat <<EOF

          ## 排查入口

          1. 先按 \`llmdoc/reference/build-and-test.md\` 的「本地测试失败的环境指纹检查表」判断是不是上游漂移(\`.tlg\` 红看 diff 形态; doc/ctan 路径看 \`pdftotext\` 泄漏; \`\\cleaders\`/\`\\special{pdf:...}\` 数值 diff 对应 backend/kernel/pgf 版本)。
          2. 参考既有上游漂移根因记录: \`llmdoc/memory/reflections/1080-upstream-tocloft-fontspec.md\`、\`1048-1050-upstream-l3backend-pgf-baseline-drift.md\`、\`1074-drop-l3backend-workaround.md\`。
          3. 本地复现(在对应包目录):

          \`\`\`bash
          gh run download ${RUN_ID} --repo ${REPO} --pattern 'ctex-kit-diff-*'
          cd <pkg> && l3build check
          \`\`\`

          4. **刷基线前先按上游根因分类**: 会自愈的(如 tlnet 落后 CTAN)不刷, 上游不会回退的才刷, 且必须用 \`l3build save\` 重新生成(不能正则改数字)。

          ---
          _由 test.yml 的定时失败哨兵自动创建; 后续分析由 agentic-issue-dispatch 接手。_
          EOF
          )"
          BODY="${HEAD}${DIFF_SECTION}${TAIL}"

          # 去重: 命中已有同标题 open issue 则评论, 否则新建。搜索最终一致,
          # 但本 workflow 只有这一个 job 开 issue, 无并发竞态。
          EXISTING="$(gh issue list --repo "$REPO" --state open \
                        --search "in:title \"$TITLE\"" --json number \
                        --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" \
              --body "再次触发定时失败: ${RUN_URL}"
            echo "commented on existing issue #${EXISTING}"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label "upstream" --body "$BODY"
            echo "created new issue: $TITLE"
          fi

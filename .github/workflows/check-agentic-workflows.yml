name: Check Agentic Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/agentic-*.yml'
      - '.github/workflows/check-agentic-workflows.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.claude/skills/**'
      - '.github/tl_packages'
      - '.github/font-urls.txt'
      - '.github/agentic-runtime.md'
      - '.githooks/pre-push'
      - '.githooks/check-pr-ci.sh'
      - 'scripts/test-agentic-workflow-contract.py'
      - 'scripts/validate-action-metadata.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    if: github.repository == 'CTeX-org/ctex-kit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller contracts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Action metadata validator dependency
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap gcc python3-yaml shellcheck

      - name: Test local Agent workflow contracts
        run: python3 scripts/test-agentic-workflow-contract.py

      - name: Validate composite Action metadata
        run: python3 scripts/validate-action-metadata.py .github/actions/*/action.yml

      - name: Lint Agent shell scripts
        run: |
          shellcheck \
            .githooks/pre-push \
            .githooks/check-pr-ci.sh \
            .github/scripts/agentic/*.sh \
            .github/scripts/pr-review/prepare-review-history.sh

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint Agent workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/agentic-pr-review.yml \
            .github/workflows/agentic-issue-dispatch.yml \
            .github/workflows/agentic-llmdoc-updater.yml \
            .github/workflows/check-agentic-workflows.yml

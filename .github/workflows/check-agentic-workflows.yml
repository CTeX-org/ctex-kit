name: Check Agentic Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/agentic-*.yml'
      - '.github/workflows/check-agentic-workflows.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.claude/skills/**'
      - '.github/tl_packages'
      - '.github/font-urls.txt'
      - '.github/agentic-runtime.md'
      - 'scripts/test-agentic-workflow-contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    if: github.repository == 'CTeX-org/ctex-kit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller contracts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test local Agent workflow contracts
        run: python3 scripts/test-agentic-workflow-contract.py

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint Agent workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/agentic-pr-review.yml \
            .github/workflows/agentic-issue-dispatch.yml \
            .github/workflows/agentic-llmdoc-updater.yml \
            .github/workflows/check-agentic-workflows.yml

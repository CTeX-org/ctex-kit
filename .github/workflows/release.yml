name: Release package

on:
  push:
    tags:
      - 'ctex-v*'
      - 'xeCJK-v*'
      - 'CJKpunct-v*'
      - 'zhnumber-v*'
      - 'xCJK2uni-v*'
      - 'xpinyin-v*'
      - 'zhmetrics-v*'
      - 'zhmetrics-uptex-v*'
      - 'zhspacing-v*'
      - 'zhlineskip-v*'

permissions:
  contents: write
  actions: read

env:
  NOTO_SANS_URL: https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/03_NotoSansCJK-OTC.zip
  NOTO_SERIF_URL: https://github.com/notofonts/noto-cjk/releases/download/Serif2.002/04_NotoSerifCJKOTC.zip
  # 跟 test.yml 顶层 env 保持一致, 复用 PR #901 weekly bypass cache.
  TL_VERSION: '2026'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Parse tag
      id: parse
      run: |
        TAG="${GITHUB_REF_NAME}"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

        case "${TAG}" in
          ctex-v*)

            echo "pkg=ctex"                     >> "$GITHUB_OUTPUT"
            echo "dir=ctex"                     >> "$GITHUB_OUTPUT"
            echo "module=ctex"                  >> "$GITHUB_OUTPUT"
            echo "dtx=*.dtx"                    >> "$GITHUB_OUTPUT"
            echo "ver=${TAG#ctex-v}"            >> "$GITHUB_OUTPUT"
            ;;
          xeCJK-v*)
            echo "pkg=xeCJK"                    >> "$GITHUB_OUTPUT"
            echo "dir=xeCJK"                    >> "$GITHUB_OUTPUT"
            echo "module=xecjk"                 >> "$GITHUB_OUTPUT"
            echo "dtx=xeCJK.dtx"                >> "$GITHUB_OUTPUT"
            echo "ver=${TAG#xeCJK-v}"           >> "$GITHUB_OUTPUT"
            ;;
          CJKpunct-v*)
            echo "pkg=CJKpunct"                 >> "$GITHUB_OUTPUT"
            echo "dir=CJKpunct"                 >> "$GITHUB_OUTPUT"
            echo "module=cjkpunct"              >> "$GITHUB_OUTPUT"
            echo "dtx=CJKpunct.dtx"             >> "$GITHUB_OUTPUT"
            echo "ver=${TAG#CJKpunct-v}"        >> "$GITHUB_OUTPUT"
            ;;
          zhnumber-v*)
            echo "pkg=zhnumber"                 >> "$GITHUB_OUTPUT"
            echo "dir=zhnumber"                 >> "$GITHUB_OUTPUT"
            echo "module=zhnumber"              >> "$GITHUB_OUTPUT"
            echo "dtx=zhnumber.dtx"             >> "$GITHUB_OUTPUT"
            echo "ver=${TAG#zhnumber-v}"        >> "$GITHUB_OUTPUT"
            ;;
          xCJK2uni-v*)
            echo "pkg=xCJK2uni"                 >> "$GITHUB_OUTPUT"
            echo "dir=xCJK2uni"                 >> "$GITHUB_OUTPUT"
            echo "module=xcjk2uni"              >> "$GITHUB_OUTPUT"
            echo "dtx=xCJK2uni.dtx"             >> "$GITHUB_OUTPUT"
            echo "ver=${TAG#xCJK2uni-v}"        >> "$GITHUB_OUTPUT"
            ;;
          xpinyin-v*)
            echo "pkg=xpinyin"                  >> "$GITHUB_OUTPUT"
            echo "dir=xpinyin"                  >> "$GITHUB_OUTPUT"
            echo "module=xpinyin"               >> "$GITHUB_OUTPUT"
            echo "dtx=xpinyin.dtx"              >> "$GITHUB_OUTPUT"
            echo "ver=${TAG#xpinyin-v}"         >> "$GITHUB_OUTPUT"
            ;;
          zhmetrics-uptex-v*)
            echo "pkg=zhmetrics-uptex"          >> "$GITHUB_OUTPUT"
            echo "dir=zhmetrics-uptex"          >> "$GITHUB_OUTPUT"
            echo "module=zhmetrics-uptex"       >> "$GITHUB_OUTPUT"
            echo "dtx="                         >> "$GITHUB_OUTPUT"
            echo "ver=${TAG#zhmetrics-uptex-v}" >> "$GITHUB_OUTPUT"
            ;;
          zhmetrics-v*)
            echo "pkg=zhmetrics"                >> "$GITHUB_OUTPUT"
            echo "dir=zhmetrics"                >> "$GITHUB_OUTPUT"
            echo "module=zhmcjk"                >> "$GITHUB_OUTPUT"
            echo "dtx=zhmCJK.dtx"               >> "$GITHUB_OUTPUT"
            echo "ver=${TAG#zhmetrics-v}"       >> "$GITHUB_OUTPUT"
            ;;
          zhspacing-v*)
            echo "pkg=zhspacing"                >> "$GITHUB_OUTPUT"
            echo "dir=zhspacing"                >> "$GITHUB_OUTPUT"
            echo "module=zhspacing"             >> "$GITHUB_OUTPUT"
            echo "dtx="                         >> "$GITHUB_OUTPUT"
            echo "ver=${TAG#zhspacing-v}"       >> "$GITHUB_OUTPUT"
            ;;
          zhlineskip-v*)
            echo "pkg=zhlineskip"               >> "$GITHUB_OUTPUT"
            echo "dir=zhlineskip"               >> "$GITHUB_OUTPUT"
            echo "module=zhlineskip"            >> "$GITHUB_OUTPUT"
            echo "dtx=zhlineskip.dtx"           >> "$GITHUB_OUTPUT"
            echo "ver=${TAG#zhlineskip-v}"      >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Unknown tag format: ${TAG}"
            exit 1
            ;;
        esac

    # ── 版本三方一致性校验 (仅对支持 l3build tag 的包生效) ──────────────
    # git tag / build.lua version / dtx $Id:$ stamp 三者必须一致, 否则拒绝
    # 发版. 防两类事故:
    #   1. bump 了 build.lua version 但忘跑 `l3build tag` → stamp stale;
    #   2. 打 git tag 时版本号敲错 / 忘 bump build.lua → 发出去的包内容
    #      与 tag 版本不匹配.
    # PR 阶段有 check-tag.yml 拦第 1 类 (l3build tag 后 diff 必须为零),
    # 这里是发版出口的最后一道检查, 顺带把第 2 类也挡住.
    # RC tag (-rcN) 剥后缀后比对 base version -- RC 是同一版本的预发布,
    # build.lua / stamp 均写 base version.
    - name: Verify version consistency (git tag vs build.lua vs stamp)
      run: |
        DIR="${{ steps.parse.outputs.dir }}"
        VER="${{ steps.parse.outputs.ver }}"
        BASE_VER=$(printf '%s' "${VER}" | sed -E 's/-(rc[0-9]+|pre[0-9]*|alpha[0-9]*|beta[0-9]*)$//')

        case "${DIR}" in
          ctex)
            # build.lua: version = "2.6.1" (无 v 前缀)
            LUA_VER=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "${DIR}/build.lua" | head -1)
            # stamp: 6 个拆分 dtx 各一条 `$Id: <file> 2.6.1 ...$`, 全部一致才行.
            # awk $4: $1=\GetIdInfo $2=$Id: $3=<file>.dtx $4=<version>
            STAMP_VERS=$(grep -hoE '\\GetIdInfo \$Id: ctex[a-z-]*\.dtx [0-9]+\.[0-9]+\.[0-9a-z]+ ' "${DIR}"/ctex*.dtx \
                         | awk '{print $4}' | sort -u)
            ;;
          zhlineskip)
            # build.lua: version = "v1.0g" (带 v 前缀, 剥掉对齐 git tag 的 ver)
            LUA_VER=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"v?([^"]+)".*/\1/p' "${DIR}/build.lua" | head -1)
            STAMP_VERS=$(grep -hoE '\\GetIdInfo \$Id: zhlineskip\.dtx v[0-9]+\.[0-9]+[a-z]? ' "${DIR}/zhlineskip.dtx" \
                         | awk '{print $4}' | sed 's/^v//' | sort -u)
            ;;
          xeCJK)
            # #1041: xeCJK 此前走下面的 `*)` 跳过校验, 于是 v3.10.5-rc2 发出了
            # 一个自报 v3.10.4 的包 -- git tag 是 3.10.5, .dtx 还写 3.10.4.
            #
            # 版本不在 `$Id:$` stamp 里 (xeCJK 的那行是未展开的 `\GetIdInfo$Id$`,
            # 由 replace_git_id 在打包时填 git 信息, 不含版本), 而在
            # `%<!driver>  {\ExplFileDate}{3.10.5}{\ExplFileDescription}`.
            LUA_VER=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"v?([^"]+)".*/\1/p' "${DIR}/build.lua" | head -1)
            # 版本号语法必须与写入侧一致, 包括写入侧做过的每一步规范化.
            #
            # `v` 前缀: 写入侧 (support/build-config.lua 的 update_tag) 有
            # `target:gsub("^v", "")`, 所以 version = "v3.10.5" 时 PR 校验会放行
            # (tag 后 diff 为零); 这里若不剥就会拒绝, 且给出的 "本地跑 l3build tag"
            # 提示照做也不会有任何变化. zhlineskip 那条本就写了 `"v?([^"]+)"`,
            # 这里是照抄 ctex 时漏的. 写入侧 (support/build-config.lua 的
            # update_tag, 模式 `({\ExplFileDate})%b{}`) 对内容不作任何约束, 所以这里
            # 也不能假定 "三段式数字": 两段式 (3.11) 或带后缀 (jiazhu 现在就是
            # 0.0-beta) 都是合法的. 早先写成 `[0-9]+\.[0-9]+\.[0-9a-z]+` 时, 两段式
            # 能通过 PR 校验却在这里提取为空, 报出 `stamp=` 这种既空又指向 xeCJK 并不
            # 存在的 `$Id:$` stamp 的误导信息.
            # 区分两种失败: 文件不存在 vs 文件里没有那一行. 只报后者会把
            # "路径写错/包结构变了" 误导成 "版本行格式不对".
            if [ ! -f "${DIR}/xeCJK.dtx" ]; then
              echo "::error::${DIR}/xeCJK.dtx 不存在. 若包结构有变, 请同步更新本 case."
              exit 1
            fi
            STAMP_VERS=$(sed -nE 's/.*\{\\ExplFileDate\}\{([^}]*)\}.*/\1/p' "${DIR}/xeCJK.dtx" \
                         | sort -u)
            if [ -z "${STAMP_VERS}" ]; then
              echo "::error::未能从 ${DIR}/xeCJK.dtx 提取 {\\ExplFileDate}{...} 版本号."
              echo "::error::该行形如 '%<!driver>  {\\ExplFileDate}{3.10.5}{\\ExplFileDescription}'."
              exit 1
            fi
            ;;
          xpinyin)
            # 与 xeCJK 同一套: build.lua 的 version 是事实源, 共享 update_tag
            # 把它回写进 .dtx. xpinyin.dtx 有**两处**版本写法, 都要校验:
            #   * `\ProvidesExplPackage` 后的 `{\ExplFileDate}{<ver>}`;
            #   * `xpinyin-database.def` 的 `[<日期> v<ver> xpinyin database]`.
            # 只校验前者会漏掉后者失同步的情况 —— 那正是共享 update_tag 的幂等
            # 守卫早期只看 `{\ExplFileDate}` 时踩过的坑 (见 support/build-config.lua).
            LUA_VER=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"v?([^"]+)".*/\1/p' "${DIR}/build.lua" | head -1)
            if [ ! -f "${DIR}/xpinyin.dtx" ]; then
              echo "::error::${DIR}/xpinyin.dtx 不存在. 若包结构有变, 请同步更新本 case."
              exit 1
            fi
            # 两处**分别**提取并各自要求非空, 然后再合并去重.
            #
            # 不能只对合并结果判空: 那样第二条 sed 静默失配 (模式写错、或那一行被
            # 改动/删除) 时, 合并结果仍是第一处提取到的单个版本号, 既非空又唯一,
            # 校验照样绿 —— 而"覆盖两处写法"恰恰是本 case 存在的理由.
            # 实测: 删掉 `[<日期> v<ver> xpinyin database]` 那一行后, 旧写法得到
            # count=1 而通过.
            # 两条模式都必须锚到它们各自那一行的**标志性内容**, 不能只匹配形状.
            #
            # DEF_VER 尤其要锚: `[<日期> v<版本> ...]` 这个形状在说明性注释里并不
            # 罕见 (support/build-config.lua 的注释里就有), 不锚定的话, 真正的
            # `%<database>` 行被删除或改动后, 文件里任何一句含该形状的注释都能让这条
            # 判空恒绿 —— 而「覆盖两处写法」正是本 case 存在的唯一理由.
            # 实测: 删掉真行再追加一句 `% 举例: ... [2019/01/01 v3.1 something else]`,
            # 未锚定的模式提取到 3.1 并通过.
            # 锚点必须绑到**行首的 docstrip 守卫** (`%<package>` / `%<database>`),
            # 不能只绑描述串: 描述串虽然在当前文件里唯一, 却不是「只可能出现在那一行」
            # 的串 —— 把版本行原样引进说明文字是本仓已有的习惯 (本 case 下面的报错
            # 文案自己就逐字写出了那一行). 实测: 删掉真行再追加一句
            # `% 该行形如 [2022/07/14 v3.1 xpinyin database]`, 只绑描述串的模式仍提取到
            # 3.1 并通过; 绑了 `^%<database>` 则不会 —— 注释引用带不上这个前缀.
            # `%` 在 ERE 里不是元字符, 无需转义.
            #
            # 分隔空白一律用 `[[:space:]]+` / `[[:space:]]*` 而不是字面单空格:
            # 描述串前写成两个空格对 LaTeX 与 update_tag 的回写都无害
            # (后者只重写 `[<日期> v<版本>` 前半段), 但会让字面单空格的模式提取为空,
            # 于是 fail-closed 挡住一次本该放行的发版. 同 case 上方的 LUA_VER 本就用
            # `[[:space:]]*`, 这里对齐.
            EXPL_VER=$(sed -nE 's/^%<package>[[:space:]]*\{\\ExplFileDate\}\{([^}]*)\}\{\\ExplFileDescription\}.*/\1/p' "${DIR}/xpinyin.dtx" | sort -u)
            DEF_VER=$(sed -nE 's/^%<database>[[:space:]]*\[[0-9]{4}\/[0-9]{2}\/[0-9]{2}[[:space:]]+v([^] ]+)[[:space:]]+xpinyin[[:space:]]+database\].*/\1/p' "${DIR}/xpinyin.dtx" | sort -u)
            # 第三处 (#550 新增的查询表). 与 DEF_VER 同样锚死 `%<querydb>` 前缀与
            # 描述串, 理由见上: 只绑 `[<日期> v<版本>]` 形状会命中说明性注释.
            QUERY_VER=$(sed -nE 's/^%<querydb>[[:space:]]*\[[0-9]{4}\/[0-9]{2}\/[0-9]{2}[[:space:]]+v([^] ]+)[[:space:]]+xpinyin[[:space:]]+query[[:space:]]+database\].*/\1/p' "${DIR}/xpinyin.dtx" | sort -u)
            if [ -z "${EXPL_VER}" ]; then
              echo "::error::未能从 ${DIR}/xpinyin.dtx 提取 {\\ExplFileDate}{...} 版本号."
              echo "::error::该行形如 '%<package>  {\\ExplFileDate}{3.1}{\\ExplFileDescription}'."
              exit 1
            fi
            if [ -z "${DEF_VER}" ]; then
              echo "::error::未能从 ${DIR}/xpinyin.dtx 提取 '[<日期> v<版本> ...]' 版本号."
              echo "::error::该行形如 '%<database>  [2022/07/14 v3.1 xpinyin database]'."
              echo "::error::共享 update_tag 会同时回写这三处, 缺一即说明模式或文件结构已变."
              exit 1
            fi
            if [ -z "${QUERY_VER}" ]; then
              echo "::error::未能从 ${DIR}/xpinyin.dtx 提取查询表的 '[<日期> v<版本> ...]' 版本号."
              echo "::error::该行形如 '%<querydb>  [2026/08/06 v3.1 xpinyin query database]'."
              echo "::error::共享 update_tag 会同时回写这三处, 缺一即说明模式或文件结构已变."
              exit 1
            fi
            STAMP_VERS=$(printf '%s\n%s\n%s\n' "${EXPL_VER}" "${DEF_VER}" "${QUERY_VER}" | sort -u)
            ;;
          zhnumber|xCJK2uni|zhmetrics)
            # 与 xeCJK / xpinyin 同一套: build.lua 的 version 是事实源, 共享
            # update_tag 把它回写进 `{\ExplFileDate}{<ver>}`.
            #
            # 这两个包此前落进下面的 `*)`, 打的是「不使用 l3build tag 版本
            # stamp 机制, 跳过三方校验」—— 而那句话是错的: 两者的 .dtx 都有
            # `{\ExplFileDate}{<ver>}`, 实测 `l3build tag 9.9.9` 各回写 1 行.
            # 与 #1041 的 xeCJK rc2 错版是同一类缺口 (白名单式校验默认放行,
            # 且用 notice 而非 error, CI 全绿没人读).
            #
            # 两包各只有一处版本写法 (不像 xpinyin 有两处), 所以这里只提取一处;
            # 但仍必须**锚定**, 理由同 xpinyin case: 不锚的话真行被删除/改动后,
            # 文件里任何一句引用该形状的注释都能让判空恒绿.
            #   * zhnumber 的版本行带 docstrip 守卫 `%<package|config>`, 锚它;
            #   * xCJK2uni 的版本行**没有**守卫 (行首只有缩进空白), 只能锚
            #     `^[[:space:]]*` + 完整形状. 注意该文件另有一处 `\ExplFileDate`
            #     出现在 `\date{...}` 里 (说明性用法), 完整形状可以排除它 ——
            #     实测该行不会被匹配.
            LUA_VER=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"v?([^"]+)".*/\1/p' "${DIR}/build.lua" | head -1)
            DTX="${{ steps.parse.outputs.dtx }}"
            if [ ! -f "${DIR}/${DTX}" ]; then
              echo "::error::${DIR}/${DTX} 不存在. 若包结构有变, 请同步更新本 case."
              exit 1
            fi
            case "${DIR}" in
              zhnumber)
                STAMP_VERS=$(sed -nE 's/^%<package\|config>[[:space:]]*\{\\ExplFileDate\}\{([^}]*)\}\{\\ExplFileDescription\}.*/\1/p' "${DIR}/${DTX}" | sort -u)
                HINT='%<package|config>  {\ExplFileDate}{3.1}{\ExplFileDescription}'
                ;;
              xCJK2uni)
                STAMP_VERS=$(sed -nE 's/^[[:space:]]*\{\\ExplFileDate\}\{([^}]*)\}\{\\ExplFileDescription\}.*/\1/p' "${DIR}/${DTX}" | sort -u)
                HINT='  {\ExplFileDate}{1.0}{\ExplFileDescription}'
                ;;
              zhmetrics)
                # 本包用**旧式** `[<日期> v<版本> <描述>]` 写法, 不是
                # `{\ExplFileDate}{<ver>}`. 锚点绑到描述串 `setup CJK fonts
                # dynamically` —— 该行没有 docstrip 守卫 (它在 `%<*package>`
                # 与 `%</package>` 之间, 行首只有缩进), 而 `[<日期> v<版本>]`
                # 这个形状在注释里并不罕见, 只匹配形状会被说明性文字骗过.
                STAMP_VERS=$(sed -nE 's/^[[:space:]]*\[[0-9]{4}\/[0-9]{2}\/[0-9]{2}[[:space:]]+v([^][:space:]]+)[[:space:]]+setup[[:space:]]+CJK[[:space:]]+fonts[[:space:]]+dynamically\].*/\1/p' "${DIR}/${DTX}" | sort -u)
                HINT='    [2022/07/09 v0.9d setup CJK fonts dynamically]'
                ;;
            esac
            if [ -z "${STAMP_VERS}" ]; then
              echo "::error::未能从 ${DIR}/${DTX} 提取 {\\ExplFileDate}{...} 版本号."
              echo "::error::该行形如 '${HINT}'."
              echo "::error::提取模式已锚到行首, 真行被删除或改动时会走到这里 (fail-closed)."
              exit 1
            fi
            ;;
          *)
            echo "::notice::${DIR} 不使用 l3build tag 版本 stamp 机制, 跳过三方校验"
            exit 0
            ;;
        esac

        fail=0
        if [ "${LUA_VER}" != "${BASE_VER}" ]; then
          echo "::error::版本不一致: git tag=${BASE_VER} (来自 ${{ steps.parse.outputs.tag }}), 但 ${DIR}/build.lua version=${LUA_VER}"
          fail=1
        fi
        if [ "$(printf '%s\n' "${STAMP_VERS}" | wc -l)" -ne 1 ]; then
          echo "::error::源文件 stamp 版本不统一: $(printf '%s ' ${STAMP_VERS})"
          fail=1
        elif [ "${STAMP_VERS}" != "${BASE_VER}" ]; then
          echo "::error::版本不一致: git tag=${BASE_VER}, 但源文件版本 stamp=${STAMP_VERS}"
          echo "::error::(ctex/zhlineskip 的 stamp 在 \$Id:\$ 行; xeCJK 在 {\\ExplFileDate}{...})"
          fail=1
        fi
        if [ "${fail}" -ne 0 ]; then
          echo "::error::修复: 更新 ${DIR}/build.lua 的 version 与 git tag 对齐, 本地跑 'cd ${DIR} && l3build tag' 回写 stamp, commit 后重新打 tag."
          exit 1
        fi
        echo "✓ 三方版本一致: git tag = build.lua = stamp = ${BASE_VER}"

    # PR #901 weekly bypass cache, 跟 test.yml 的 caller / warmup-tl 共享同
    # 一个 key (tl-bypass-Linux-2026-<ISO 周>). Schedule 每周一 12:00 UTC
    # 跑 test.yml warmup-tl 刷新这个 cache, 周内打 release tag 触发本工作流
    # 时直接 cache hit, 跳过 setup-texlive-action (~70s → ~10s restore).
    - name: Compute TL cache week
      id: tlcache
      run: |
        week="$(TZ=UTC date +'%G-W%V')"
        echo "week=${week}" >> "$GITHUB_OUTPUT"
        echo "TL cache week: ${week}"

    - name: TL bypass cache (restore)
      id: bypass-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/setup-texlive-action/${{ env.TL_VERSION }}
        # key 含 weekly + tl_packages hash. 见 test.yml warmup-tl 同款 key 注释.
        key: tl-bypass-${{ runner.os }}-${{ env.TL_VERSION }}-${{ steps.tlcache.outputs.week }}-${{ hashFiles('.github/tl_packages') }}

    # cache hit fast path: export PATH + sanity check. 失败时 continue-on-error
    # 让下面 setup-texlive fallback 接管 (cache 损坏 / 极少). Linux runner 上
    # tlmgr 直接可调用, 不需要 tlmgr.bat hack.
    - name: Export PATH (cache hit fast path)
      id: export-path
      if: steps.bypass-cache.outputs.cache-hit == 'true'
      continue-on-error: true
      run: |
        TL_BIN="${{ runner.temp }}/setup-texlive-action/${{ env.TL_VERSION }}/bin/x86_64-linux"
        echo "$TL_BIN" >> "$GITHUB_PATH"
        echo "Added to PATH: $TL_BIN"
        "$TL_BIN/tlmgr" version

    - name: Install TeX Live (fallback, cache miss or corrupt)
      if: steps.bypass-cache.outputs.cache-hit != 'true' || steps.export-path.outcome == 'failure'
      timeout-minutes: 30
      uses: TeX-Live/setup-texlive-action@v4
      with:
        version: ${{ env.TL_VERSION }}
        package-file: .github/tl_packages
        repository: https://ctan.math.illinois.edu/systems/texlive/tlnet
        update-all-packages: true
        # 关闭 setup-texlive 内部 cache, 我们自己用 bypass-cache.
        cache: false

    - name: Install zhmakeindex
      run: |
        ZHMK_VERSION=$(gh api repos/Liam0205/zhmakeindex/releases/latest --jq '.tag_name')
        ZHMK_URL="https://github.com/Liam0205/zhmakeindex/releases/download/${ZHMK_VERSION}/zhmakeindex_${ZHMK_VERSION#v}_linux_amd64.tar.gz"
        curl -fsSL "$ZHMK_URL" | tar xz -C /usr/local/bin zhmakeindex
        zhmakeindex >/dev/null 2>&1
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install CJK fonts
      run: |
        sudo apt-get install -y --no-install-recommends fonts-freefont-ttf
        HANAMINB_URL="https://github.com/googlefonts/chinese/raw/gh-pages/fonts/HanaMin/HanaMinB.ttf"
        NOTO_SYMBOLS2_URL="https://github.com/notofonts/symbols/releases/download/NotoSansSymbols2-v2.008/NotoSansSymbols2-v2.008.zip"
        curl -LO ${{ env.NOTO_SANS_URL }}
        curl -LO ${{ env.NOTO_SERIF_URL }}
        curl -fsSL -o HanaMinB.ttf "$HANAMINB_URL"
        curl -LO "$NOTO_SYMBOLS2_URL"
        sudo mkdir -p /usr/share/fonts/truetype
        for f in *OTC.zip; do unzip -ojd /usr/share/fonts/truetype "$f" "*.ttc"; done
        for f in NotoSansSymbols2-*.zip; do unzip -ojd /usr/share/fonts/truetype "$f" "*.ttf"; done
        cp HanaMinB.ttf /usr/share/fonts/truetype/
        fc-cache -f

    - name: Download Unihan data (xeCJK)
      if: steps.parse.outputs.pkg == 'xeCJK'
      run: curl -fsSL -o support/Unihan.zip "https://www.unicode.org/Public/UNIDATA/Unihan.zip"

    # 临时措施 (#1048/#1050/#1051): 修正 tlnet 上 l3kernel 与 l3backend 的
    # 版本错配. 详细根因、症状与撤除条件见 scripts/sync-l3backend.sh.
    #
    # 必须在 l3build ctan 之前. ctan target 内部会 call check, 所以 .tlg
    # 那侧的红能被发现; 但它同时打包 typeset 出来的 PDF, 而 PDF 里的
    # "0gray 0" 泄漏不触发任何退出码 —— 缺这一步会把带缺陷的文档送进
    # CTAN zip, 且 release-ctan-upload.yml 只是原样转发这个 zip.
    - name: Sync l3backend to l3kernel (upstream version skew)
      shell: bash
      run: bash ./scripts/sync-l3backend.sh

    - name: Build CTAN zip
      working-directory: ./${{ steps.parse.outputs.dir }}
      run: l3build ctan

    - name: Prepare release asset
      run: |
        MODULE="${{ steps.parse.outputs.module }}"
        VER="${{ steps.parse.outputs.ver }}"
        SHORT_SHA=$(git rev-parse --short HEAD)
        ASSET="${MODULE}-v${VER}-${SHORT_SHA}.zip"
        mv "${{ steps.parse.outputs.dir }}/${MODULE}-ctan.zip" "${ASSET}"
        echo "asset=${ASSET}" >> "$GITHUB_ENV"

    - name: Generate release notes
      run: |
        PKG="${{ steps.parse.outputs.pkg }}"
        DIR="${{ steps.parse.outputs.dir }}"
        DTX="${{ steps.parse.outputs.dtx }}"
        VER="${{ steps.parse.outputs.ver }}"
        TAG="${{ steps.parse.outputs.tag }}"

        NOTES_FILE="release-notes.md"

        # RC tags (e.g. 3.10.1-rc1, 3.10.1-rc2) share the same \changes entries
        # as the base version (3.10.1), since RCs are pre-release builds of
        # the same upcoming release. Strip the -rcN / -pre / -alpha / -beta
        # suffix to look up \changes against the base version.
        BASE_VER=$(printf '%s' "${VER}" | sed -E 's/-(rc[0-9]+|pre[0-9]*|alpha[0-9]*|beta[0-9]*)$//')

        # Try extracting from \changes entries. 共用 scripts/extract-changes.py
        # 与 release-ctan-upload.yml 一致, 防 \changes → markdown 的清洗规则
        # 在两个 workflow 间漂移.
        python3 scripts/extract-changes.py "${DIR}/${DTX}" "v${BASE_VER}" > "${NOTES_FILE}"

        # Fallback: use git log between previous tag and current tag
        if [ ! -s "${NOTES_FILE}" ]; then
          PREV_TAG=$(git tag -l "${PKG}-v*" --sort=-version:refname | sed -n '2p')
          if [ -n "${PREV_TAG}" ]; then
            git log --oneline "${PREV_TAG}..${TAG}" -- "${DIR}/" \
              | grep -v -E "^[a-f0-9]+ (chore|docs|Merge)" \
              | sed 's/^[a-f0-9]* /- /' > "${NOTES_FILE}"
          fi
        fi

        # Final fallback
        if [ ! -s "${NOTES_FILE}" ]; then
          echo "Release ${PKG} v${VER}" > "${NOTES_FILE}"
        fi

        echo "--- Release Notes ---"
        cat "${NOTES_FILE}"

    - name: Wait for test CI to pass
      run: |
        SHA="${{ github.sha }}"
        echo "Waiting for 'ctex-kit test' to pass on ${SHA:0:8}..."

        for i in $(seq 1 120); do
          RESULT=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=${SHA}&per_page=1" \
            --jq 'if (.workflow_runs | length) == 0 then "none"
                  else .workflow_runs[0] | "\(.status);\(.conclusion)" end') || RESULT=""

          if [ -z "$RESULT" ] || [ "$RESULT" = "none" ]; then
            echo "  No test run found yet, retrying... (attempt ${i}/60)"
            sleep 30
            continue
          fi

          STATUS="${RESULT%%;*}"
          CONCLUSION="${RESULT##*;}"

          if [ "$CONCLUSION" = "success" ]; then
            echo "Test CI passed!"
            exit 0
          elif [ "$STATUS" = "completed" ]; then
            echo "::error::Test CI finished with: ${CONCLUSION}"
            exit 1
          fi

          echo "  Test CI status: ${STATUS}, waiting... (attempt ${i}/120)"
          sleep 30
        done

        echo "::error::Timeout after 60 minutes waiting for test CI"
        exit 1
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release
      run: |
        gh release delete "${{ steps.parse.outputs.tag }}" --yes 2>/dev/null || true
        gh release create "${{ steps.parse.outputs.tag }}" \
          "${{ env.asset }}" \
          --prerelease \
          --title "${{ steps.parse.outputs.pkg }} v${{ steps.parse.outputs.ver }}" \
          --notes-file release-notes.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: ctex-kit check-tag

# PR 校验: 校验"支持 l3build tag 的包"(zhlineskip / ctex / xeCJK) 的源文件
# 版本 stamp 与 build.lua 的 version 字段一致.
#
# 机制: 这些包的 build.lua 把 `version` 作为发版事实源, `l3build tag` 把它
# 回写进 .dtx 的版本行. 该回写是维护者本地手跑的, 忘跑的话 stamp 落后于
# version, 发出去的包源文件版本行是 stale 的.
#
# 回写目标有两套, 因为 .dtx 的版本写法不同:
#   * ctex / zhlineskip: `\GetIdInfo $Id: <file> <ver> ...$` 行, 各自在
#     build.lua 里覆写 update_tag (zhlineskip PR #892 首创, ctex PR #937 移植);
#   * xeCJK: `{\ExplFileDate}{<ver>}`, 用 support/build-config.lua 的共享
#     update_tag (#1041 起以 build.lua 的 version 为事实源).
#
# xeCJK 是 #1041 补进来的: 此前它不在任何版本校验内, 发 v3.10.5-rc2 时 .dtx
# 仍写 3.10.4, 打出的包自报 v3.10.4 而 git tag 是 v3.10.5, 两道校验都没拦住
# (release.yml 的三方校验当时只覆盖 ctex / zhlineskip, xeCJK 走 `*)` 跳过).
#
# 本 workflow 在 PR 上跑 `l3build tag` + `git diff --exit-code`:
#   - update_tag 有幂等守卫 (stamp 版本 == version 时不回写),
#     所以 stamp 已同步时 diff 为零 → pass;
#   - bump 了 version 没跑 tag 时 CI 会确实回写 → diff 非零 → fail,
#     提示作者本地跑 `l3build tag` 并 commit.
#
# 触发/结构参考 check-doc.yml (caller-per-pkg 的精简版: tag 是秒级纯文本
# 操作, 不需要 reusable workflow, 三个包各一个内联 job 即可).
#
# release.yml 侧还有第二道校验: 打 release tag 时校验 git tag / build.lua
# version / dtx stamp 三方一致, 不一致拒绝发版. 本 workflow 把问题拦在
# PR 阶段, release 校验兜底.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - 'zhlineskip/**'
      - 'ctex/**'
      - 'xeCJK/**'
      - 'xpinyin/**'
      - 'zhnumber/**'
      - 'xCJK2uni/**'
      - 'support/build-config.lua'
      - '.github/workflows/check-tag.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'master' }}

jobs:
  # 覆盖率对账: 扫全部包的 .dtx, 凡有 `l3build tag` 会回写的版本槽位、且
  # release.yml 有对应 tag 触发器的包, 都必须同时出现在本 workflow 与
  # release.yml 的三方校验里; 否则失败并指出该补哪一处.
  #
  # 为什么需要它: 本 workflow 的 paths 与 release.yml 的 case 都是**白名单**,
  # 没列进去的包静默走过 (release.yml 甚至只打 ::notice::, CI 全绿). 这个失效
  # 模式已发生两次 —— #1041 的 xeCJK (发出自报 v3.10.4 的 v3.10.5-rc2), 以及
  # 本次的 zhnumber / xCJK2uni. #1041 的反思当时就写下「白名单式校验应当有一条
  # 未覆盖清单的对账机制」并留作后续; 同一缺口出现第二次之后补上。
  #
  # 不设 paths 过滤 (总是跑): 这个 job 要防的正是「新包/改了版本写法却没更新
  # 白名单」, 而那种改动未必落在本 workflow 的 paths 里 —— 用 paths 过滤自己
  # 就会重现同一类漏报。它是秒级纯文本扫描, 无条件跑的代价可以忽略。
  gate-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconcile version-gate coverage
        run: python3 scripts/check-version-gate-coverage.py

  changes:
    runs-on: ubuntu-latest
    outputs:
      ctex:       ${{ steps.filter.outputs.ctex }}
      zhlineskip: ${{ steps.filter.outputs.zhlineskip }}
      xecjk:      ${{ steps.filter.outputs.xecjk }}
      xpinyin:    ${{ steps.filter.outputs.xpinyin }}
      zhnumber:   ${{ steps.filter.outputs.zhnumber }}
      xcjk2uni:   ${{ steps.filter.outputs.xcjk2uni }}
    steps:
      - uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            _all: &all
              - '.github/workflows/check-tag.yml'
              - 'support/build-config.lua'
            ctex:
              - *all
              - 'ctex/**'
            zhlineskip:
              - *all
              - 'zhlineskip/**'
            xecjk:
              - *all
              - 'xeCJK/**'
            xpinyin:
              - *all
              - 'xpinyin/**'
            zhnumber:
              - *all
              - 'zhnumber/**'
            xcjk2uni:
              - *all
              - 'xCJK2uni/**'

  tag-ctex:
    needs: changes
    if: needs.changes.outputs.ctex == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ctex 的 update_tag 用 `git log -1 -- <dtx>` 取日期/sha (仅在
          # stamp 版本落后需要回写时才执行). fetch-depth: 0 保证 log 可用
          # 且信息与真实历史一致.
          fetch-depth: 0
      # l3build tag 是纯 texlua 文本操作, 只需 l3build + latex-bin (texlua),
      # 不需要字体/引擎, 走最小安装 (~30s, action 内部有 cache).
      - name: Install TeX Live (minimal, l3build only)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: l3build latex-bin
      - name: l3build tag must be a no-op
        working-directory: ./ctex
        run: |
          l3build tag
          if ! git diff --exit-code -- .; then
            echo "::error::ctex 源文件版本 stamp 与 build.lua 的 version 不一致."
            echo "::error::请在本地运行: cd ctex && l3build tag, 然后 commit 回写后的 .dtx."
            exit 1
          fi
          echo "✓ ctex stamp 与 version 一致 (l3build tag 为 no-op)"

  tag-zhlineskip:
    needs: changes
    if: needs.changes.outputs.zhlineskip == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install TeX Live (minimal, l3build only)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: l3build latex-bin
      - name: l3build tag must be a no-op
        working-directory: ./zhlineskip
        run: |
          l3build tag
          if ! git diff --exit-code -- .; then
            echo "::error::zhlineskip 源文件版本 stamp 与 build.lua 的 version/date 不一致."
            echo "::error::请在本地运行: cd zhlineskip && l3build tag, 然后 commit 回写后的 .dtx."
            exit 1
          fi
          echo "✓ zhlineskip stamp 与 version 一致 (l3build tag 为 no-op)"

  tag-xecjk:
    needs: changes
    if: needs.changes.outputs.xecjk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 共享 update_tag 只改 `{\ExplFileDate}{...}`, 不读 git log, 所以不像
      # ctex 那样需要 fetch-depth: 0.
      - name: Install TeX Live (minimal, l3build only)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: l3build latex-bin
      - name: l3build tag must be a no-op
        working-directory: ./xeCJK
        run: |
          l3build tag
          # 只看 xeCJK/ : diff 范围应精确等于 `l3build tag` 的写入范围, 而它只
          # 回写本目录的 .dtx.
          #
          # 澄清一个想当然的理由: 写成 `-- . ../support` 在 CI 里其实**不会**误报,
          # 因为 CI 检出的是已提交的干净树, support 的改动不构成 diff (实测两种写
          # 法退出码都是 0). 误报只发生在本地有未提交改动时. 限定范围的真实理由是
          # 语义精确: 把非写入目标纳入 diff 不增加任何检出能力, 只会在将来某个
          # 生成物意外落进 support/ 时给出误导性的 "stamp 不同步" 报错.
          if ! git diff --exit-code -- .; then
            echo "::error::xeCJK 的 .dtx 版本与 xeCJK/build.lua 的 version 不一致."
            echo "::error::请在本地运行: cd xeCJK && l3build tag, 然后 commit 回写后的 .dtx."
            exit 1
          fi
          echo "✓ xeCJK .dtx 版本与 version 一致 (l3build tag 为 no-op)"

  tag-xpinyin:
    needs: changes
    if: needs.changes.outputs.xpinyin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 与 xeCJK 同理: 共享 update_tag 不读 git log, 不需要 fetch-depth: 0.
      - name: Install TeX Live (minimal, l3build only)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: l3build latex-bin
      - name: l3build tag must be a no-op
        working-directory: ./xpinyin
        run: |
          l3build tag
          # 只看 xpinyin/ : diff 范围应精确等于 `l3build tag` 的写入范围.
          #
          # xpinyin.dtx 有**两处**版本写法, 共享 update_tag 都会改:
          #   * `\ProvidesExplPackage` 的 `{\ExplFileDate}{<ver>}`;
          #   * `xpinyin-database.def` 的 `[<日期> v<ver> ...]`.
          # 后者只在版本号需要改时才连日期一起重写, 版本号已对则整段原样保留,
          # 所以 stamp 同步时 diff 为零 (幂等), 校验才能成立.
          if ! git diff --exit-code -- .; then
            echo "::error::xpinyin 的 .dtx 版本与 xpinyin/build.lua 的 version 不一致."
            echo "::error::请在本地运行: cd xpinyin && l3build tag, 然后 commit 回写后的 .dtx."
            exit 1
          fi
          echo "✓ xpinyin .dtx 版本与 version 一致 (l3build tag 为 no-op)"

  # zhnumber / xCJK2uni 与 xeCJK、xpinyin 同一套: 共享 update_tag + build.lua
  # 的 version 作事实源, 所以不需要 fetch-depth: 0 (共享版不读 git log).
  #
  # 这两个包本来都**不在任何版本校验内**, 与 #1041 的 xeCJK 是同一类缺口:
  # release.yml 的 case 里它们落进 `*)`, 打的是
  # `::notice::<pkg> 不使用 l3build tag 版本 stamp 机制, 跳过三方校验` ——
  # 而这句话是错的, 两者的 .dtx 都有 `{\ExplFileDate}{<ver>}`, `l3build tag`
  # 确实会回写 (实测 `l3build tag 9.9.9` 各改写 1 行). notice 不是 failure,
  # CI 全绿, 于是「从未被校验」这件事一直没人发现.
  #
  # 接入时它们都还没有 `version` 字段, 而这个字段是**必需**的, 不能只加 job:
  # 不设时不带参数的 `l3build tag` 会打印「未指定版本号, 未作任何修改」并以 0
  # 退出, 于是 job 跑完 diff 天然为零 —— 恒绿, 什么也没校验. 详见两个包
  # build.lua 里 version 上方的注释.
  tag-zhnumber:
    needs: changes
    if: needs.changes.outputs.zhnumber == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install TeX Live (minimal, l3build only)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: l3build latex-bin
      - name: l3build tag must be a no-op
        working-directory: ./zhnumber
        run: |
          l3build tag
          if ! git diff --exit-code -- .; then
            echo "::error::zhnumber 的 .dtx 版本与 zhnumber/build.lua 的 version 不一致."
            echo "::error::请在本地运行: cd zhnumber && l3build tag, 然后 commit 回写后的 .dtx."
            exit 1
          fi
          echo "✓ zhnumber .dtx 版本与 version 一致 (l3build tag 为 no-op)"

  tag-xcjk2uni:
    needs: changes
    if: needs.changes.outputs.xcjk2uni == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install TeX Live (minimal, l3build only)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: l3build latex-bin
      - name: l3build tag must be a no-op
        # 目录是 xCJK2uni/ 而 module 是小写 xcjk2uni, 这里必须用目录名.
        working-directory: ./xCJK2uni
        run: |
          l3build tag
          if ! git diff --exit-code -- .; then
            echo "::error::xCJK2uni 的 .dtx 版本与 xCJK2uni/build.lua 的 version 不一致."
            echo "::error::请在本地运行: cd xCJK2uni && l3build tag, 然后 commit 回写后的 .dtx."
            exit 1
          fi
          echo "✓ xCJK2uni .dtx 版本与 version 一致 (l3build tag 为 no-op)"

  # 汇总: 供 branch protection 单点盯 (与 test-result / check-doc-result 同构).
  check-tag-result:
    if: ${{ !cancelled() }}
    needs: [gate-coverage, tag-ctex, tag-zhlineskip, tag-xecjk, tag-xpinyin,
            tag-zhnumber, tag-xcjk2uni]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        env:
          R_COVERAGE:   ${{ needs.gate-coverage.result }}
          R_CTEX:       ${{ needs.tag-ctex.result }}
          R_ZHLINESKIP: ${{ needs.tag-zhlineskip.result }}
          R_XECJK:      ${{ needs.tag-xecjk.result }}
          R_XPINYIN:    ${{ needs.tag-xpinyin.result }}
          R_ZHNUMBER:   ${{ needs.tag-zhnumber.result }}
          R_XCJK2UNI:   ${{ needs.tag-xcjk2uni.result }}
        run: |
          fail=0
          # gate-coverage 单独判: 它没有 if: 条件, 正常情况下**不会** skipped,
          # 所以这里只接受 success. 若把它和下面各包一样放过 skipped, 那么该 job
          # 因故没跑 (例如被误加了条件、或依赖链变化) 时汇总仍会绿 —— 而它恰恰是
          # 用来防「白名单漏包」的那道检查, 静默不跑等于缺口重新打开。
          if [ "$R_COVERAGE" = "success" ]; then
            echo "✓ gate-coverage: $R_COVERAGE"
          else
            echo "✗ gate-coverage: $R_COVERAGE (该 job 应始终运行并成功)"; fail=1
          fi
          # 各包的 tag job 带 if: needs.changes.outputs.<pkg>, 未受影响时
          # skipped 是预期的。
          for nv in "ctex:$R_CTEX" "zhlineskip:$R_ZHLINESKIP" "xeCJK:$R_XECJK" \
                    "xpinyin:$R_XPINYIN" "zhnumber:$R_ZHNUMBER" \
                    "xCJK2uni:$R_XCJK2UNI"; do
            name="${nv%%:*}"; res="${nv#*:}"
            if [ "$res" = "success" ] || [ "$res" = "skipped" ]; then
              echo "✓ ${name}: ${res}"
            else
              echo "✗ ${name}: ${res}"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
